name: repo-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install kit dependencies
        run: python -m pip install -r requirements.txt
      - name: Check invariants
        run: python tools/repo-kit/check_repo.py --root .
      - name: Check generated files
        run: python tools/repo-kit/generate.py --root . --check
      - name: Check kit lock
        shell: pwsh
        run: ./tools/update-repo-kit.ps1 -Check

  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run unit tests
        run: python -m unittest discover -s tests -t tests -p "test_*.py"
